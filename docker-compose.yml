services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    command: uvicorn app.server:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
